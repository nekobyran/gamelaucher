name: Deploy static release site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - release.json
      - site.config.json
      - 404.html
      - _headers
      - _redirects
      - .nojekyll
      - assets/**
      - tools/**
      - command/Publish-StaticReleaseSite.ps1
      - .github/workflows/deploy-release-site.yml

permissions:
  contents: read

concurrency:
  group: gamelauncher-release-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source and JavaScript syntax
        run: npm run check

      - name: Build static directory
        shell: pwsh
        run: ./command/Publish-StaticReleaseSite.ps1 -Action Build -MainProjectRoot $PWD -OutputRoot "$PWD/dist"

      - name: Check deployment credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped because repository secrets are not configured."
          fi

      - name: Deploy Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        shell: pwsh
        run: ./command/Publish-StaticReleaseSite.ps1 -Action Deploy -MainProjectRoot $PWD -OutputRoot "$PWD/dist" -Branch main

      - name: Bind custom domain idempotently
        if: steps.cloudflare.outputs.ready == 'true'
        shell: pwsh
        run: ./command/Publish-StaticReleaseSite.ps1 -Action BindDomain
